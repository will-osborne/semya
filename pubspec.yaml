name: semya
description: "Семья — family messaging app"
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Preferences
  shared_preferences: ^2.3.4

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  cloud_functions: ^5.3.4

  # Local encrypted DB
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.1

  # Key protection
  flutter_secure_storage: ^9.2.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.8.1

  # WebRTC
  flutter_webrtc: ^0.12.4

  # Audio
  audio_session: ^0.1.25
  record: ^6.0.0
  just_audio: ^0.9.43
  path_provider: ^2.1.5

  # Local notifications (foreground display + Android channel)
  flutter_local_notifications: ^18.0.1

  # Native call UI (CallKit on iOS, full-screen notification on Android)
  flutter_callkit_incoming: ^2.0.4+1

  # Permissions
  permission_handler: ^11.3.1

  # Media
  image_picker: ^1.1.2
  video_compress: ^3.1.3
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  flutter_cache_manager: ^3.4.1

  # URL handling
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.1.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
